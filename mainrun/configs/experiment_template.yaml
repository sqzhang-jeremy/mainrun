# Experiment: [DESCRIPTION]
# Date: [DATE]
# Based on: best-0128-1814.yaml

# Model architecture
block_size: 64
vocab_size: 24000  # 8000, 12000, 16000, 24000
n_layer: 8
n_head: 9
d_model: 576
dropout: 0.0
mlp_ratio: 5.0
activation: gelu  # options: gelu, swiglu
residual_scaling: true  # scale residual projections by 1/sqrt(2*n_layer)

# Training
batch_size: 128
lr: 0.0003
weight_decay: 0.1
evals_per_epoch: 3
batch_mode: random  # options: random, sequential

# Optimizer settings
optimizer: adamw  # options: sgd, adamw
scheduler: warmup_cosine  # options: cosine, warmup_cosine
warmup_fraction: 0.05

# Tokenizer settings
normalizer: none           # options: none, nfkc
pre_tokenizer: bytelevel   # options: bytelevel, whitespace
eos_handling: string_join   # options: string_join, tokenize_append
min_frequency: 1            # minimum token frequency (1 = keep all)
domain_tokens: false        # add "Show HN:", "Ask HN:", "Launch HN:" as special tokens

# Fixed (do not change)
epochs: 7
seed: 1337
num_titles: 100000
val_frac: 0.10
log_file: ./logs/exp-vocab-24000.log
