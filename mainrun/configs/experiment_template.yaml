# Experiment: [DESCRIPTION]
# Date: [DATE]
# Based on: current.yaml

# Model architecture
block_size: 64
vocab_size: 16000
n_layer: 8
n_head: 9
d_model: 576
dropout: 0.0
mlp_ratio: 5.0
activation: gelu  # options: gelu, swiglu
residual_scaling: true  # scale residual projections by 1/sqrt(2*n_layer)

# Training
batch_size: 128
lr: 0.0003
weight_decay: 0.1
evals_per_epoch: 3
batch_mode: random  # options: random, sequential

# Optimizer settings
optimizer: adamw  # options: sgd, adamw
scheduler: warmup_cosine  # options: cosine, warmup_cosine
warmup_fraction: 0.05

# Fixed (do not change)
epochs: 7
seed: 1337
num_titles: 100000
val_frac: 0.10
log_file: ./logs/mainrun.log
