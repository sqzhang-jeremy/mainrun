# Experiment: Sparse attention + bottleneck, block_size=128
# Date: 2026-01-29
# Based on: winning lowercase+token combo (change: block_size 64->128, sparse attention)

# Model architecture
block_size: 128                     # CHANGED from 64
vocab_size: 24000
n_layer: 8
n_head: 9
d_model: 576
dropout: 0.0
mlp_ratio: 5.0
activation: gelu
residual_scaling: true

# Attention settings
attention_type: sparse              # CHANGED from causal
attn_intermediate_dim: 288          # 50% bottleneck
local_attn_ctx: 32                  # 32-token local window

# Training
batch_size: 128
lr: 0.0003
weight_decay: 0.1
evals_per_epoch: 3
batch_mode: random

# Optimizer settings
optimizer: adamw
scheduler: warmup_cosine
warmup_fraction: 0.05

# Tokenizer settings
normalizer: lowercase
pre_tokenizer: whitespace
eos_handling: tokenize_append
min_frequency: 2
domain_tokens: true

# Fixed (do not change)
epochs: 7
seed: 1337
num_titles: 100000
val_frac: 0.10
log_file: ./logs/exp-sparse-b128.log
